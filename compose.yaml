services:
  cloud:
    image: ${CLOUD_IMAGE:-ghcr.io/miciav/minikube-cloud-lab/cloud:latest}
    command: [serve, --data-dir, /data, --api, "0.0.0.0:8080"]
    depends_on: [nfs]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      CLOUD_INSTANCE_LB_URL: http://instance-lb:8082
      CLOUD_INSTANCE_METRICS_URL: http://instance-metrics:9090
      CLOUD_INSTANCE_AUTOSCALER_URL: http://127.0.0.1:8085
      CLOUD_NFS_IP: ${CLOUD_NFS_IP:-172.30.0.253}
      CLOUD_STORAGE_CAPACITY: ${CLOUD_STORAGE_CAPACITY:-20Gi}
      CLOUD_DOCKER_NETWORK: minikube-cloud-lab
      CLOUD_DOCKER_IP: ${CLOUD_DOCKER_IP:-172.30.0.254}
      CLOUD_UBUNTU_IMAGE: ${UBUNTU_IMAGE:-ghcr.io/miciav/minikube-cloud-lab/instance-ubuntu:26.04}
    networks:
      portal: {}
      lab:
        ipv4_address: ${CLOUD_DOCKER_IP:-172.30.0.254}
    user: "${UID:?set UID in .env}:${GID:?set GID in .env}"
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID in .env}"
    cap_add: [DAC_OVERRIDE]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.minikube-cloud-lab:/data
      - ${HOME}/.kube:/kube
      - storage:/data/storage
    restart: unless-stopped
  nfs:
    image: ${NFS_IMAGE:-ghcr.io/miciav/minikube-cloud-lab/nfs:latest}
    cap_add: [DAC_READ_SEARCH, SYS_ADMIN]
    security_opt: [apparmor=unconfined]
    device_cgroup_rules:
      - "b 7:* rwm"
      - "c 10:237 rwm"
    networks:
      lab:
        ipv4_address: ${CLOUD_NFS_IP:-172.30.0.253}
    volumes:
      - storage:/export
    restart: unless-stopped
  portal:
    image: ${PORTAL_IMAGE:-ghcr.io/miciav/minikube-cloud-lab/portal:latest}
    depends_on: [cloud]
    ports: ["127.0.0.1:3000:3000"]
    networks: [portal]
    restart: unless-stopped
  lab:
    security_opt: [label=disable]
    image: ${LAB_IMAGE:-ghcr.io/miciav/minikube-cloud-lab/lab:latest}
    profiles: [tools]
    environment:
      KUBECONFIG: /data/minikube/kubeconfig
    network_mode: service:cloud
    user: "${UID:?set UID in .env}:${GID:?set GID in .env}"
    volumes:
      - ${HOME}/.minikube-cloud-lab:/data:ro
  kubectl-forward:
    security_opt: [label=disable]
    image: ${LAB_IMAGE:-ghcr.io/miciav/minikube-cloud-lab/lab:latest}
    profiles: [tools]
    environment:
      KUBECONFIG: /data/minikube/kubeconfig
    networks: [lab]
    user: "${UID:?set UID in .env}:${GID:?set GID in .env}"
    volumes:
      - ${HOME}/.minikube-cloud-lab:/data:ro
  instance-lb:
    image: traefik:v3.6@sha256:31267173a15b4944e797a76ffd9c419707c8d8b32fe5b610f80cd0cfa05f372d
    profiles: [instance-autoscaling]
    ports: ["127.0.0.1:8084:8080"]
    networks: [lab]
    volumes: ["${HOME}/.minikube-cloud-lab/autoscaling:/autoscaling:ro"]
    command:
      - --providers.file.directory=/autoscaling/traefik
      - --entrypoints.web.address=:8080
      - --entrypoints.metrics.address=:8081
      - --metrics.prometheus.entrypoint=metrics
      - --api.insecure=true
      - --entrypoints.traefik.address=:8082
  instance-metrics:
    image: prom/prometheus:v3.11.3@sha256:e4254400b85610324913f0dc4acf92603d9984e7519414c5a12811aa6146acc3
    profiles: [instance-autoscaling]
    ports: ["127.0.0.1:9091:9090"]
    networks: [lab]
    volumes: [./tools/instance-autoscaler/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=1d"]
  instance-autoscaler:
    image: minikube-cloud-lab/instance-autoscaler:local
    build: ./tools/instance-autoscaler
    profiles: [instance-autoscaling]
    network_mode: service:cloud
    volumes: ["${HOME}/.minikube-cloud-lab/autoscaling:/autoscaling:ro"]

networks:
  portal: {}
  lab:
    name: minikube-cloud-lab
    driver: bridge
    ipam:
      config:
        - subnet: ${CLOUD_DOCKER_SUBNET:-172.30.0.0/23}
          gateway: ${CLOUD_DOCKER_GATEWAY:-172.30.0.1}

volumes:
  storage:
    name: minikube-cloud-lab-storage
