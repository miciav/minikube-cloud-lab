services:
  cloud:
    image: ${CLOUD_IMAGE:-ghcr.io/miciav/minikube-cloud-lab/cloud:latest}
    command: [serve, --data-dir, /data, --api, "0.0.0.0:8080"]
    depends_on: [nfs]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      CLOUD_NFS_IP: ${CLOUD_NFS_IP:-172.30.0.253}
      CLOUD_DOCKER_NETWORK: minikube-cloud-lab
      CLOUD_DOCKER_IP: ${CLOUD_DOCKER_IP:-172.30.0.254}
    networks:
      lab:
        ipv4_address: ${CLOUD_DOCKER_IP:-172.30.0.254}
    user: "${UID:?set UID in .env}:${GID:?set GID in .env}"
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID in .env}"
    cap_add: [DAC_OVERRIDE]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.minikube-cloud-lab:/data
      - ${HOME}/.kube:/kube
      - storage:/data/storage
    restart: unless-stopped
  nfs:
    image: ${NFS_IMAGE:-ghcr.io/miciav/minikube-cloud-lab/nfs:latest}
    cap_add: [DAC_READ_SEARCH]
    networks:
      lab:
        ipv4_address: ${CLOUD_NFS_IP:-172.30.0.253}
    volumes:
      - storage:/export
    restart: unless-stopped
  lab:
    image: ${LAB_IMAGE:-ghcr.io/miciav/minikube-cloud-lab/lab:latest}
    profiles: [tools]
    environment:
      KUBECONFIG: /data/minikube/kubeconfig
    network_mode: service:cloud
    user: "${UID:?set UID in .env}:${GID:?set GID in .env}"
    volumes:
      - ${HOME}/.minikube-cloud-lab:/data:ro
networks:
  lab:
    name: minikube-cloud-lab
    driver: bridge
    ipam:
      config:
        - subnet: ${CLOUD_DOCKER_SUBNET:-172.30.0.0/23}
          gateway: ${CLOUD_DOCKER_GATEWAY:-172.30.0.1}

volumes:
  storage:
    name: minikube-cloud-lab-storage
