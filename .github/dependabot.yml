version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # v1.23.1 is a stray tag; kicbase releases are v0.0.N.
      - dependency-name: k8s-minikube/kicbase
        versions: [">= 1.0.0"]
