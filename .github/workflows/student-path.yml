name: Student path
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
concurrency:
  group: student-path-${{ github.ref }}
  cancel-in-progress: false
env:
  CLOUD_IMAGE: minikube-cloud-lab/cloud:dev
  LAB_IMAGE: minikube-cloud-lab/lab:dev
  KUBECTL_VERSION: v1.35.6
jobs:
  student-path:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build images
        run: make images
      - name: Install matching kubectl
        run: |
          curl -fsSLo /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl -fsSLo /tmp/kubectl.sha256 "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
          (cd /tmp && printf '%s  kubectl\n' "$(cat kubectl.sha256)" | sha256sum -c -)
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
      - name: Student autoscaling cycle
        run: |
          source scripts/configure.sh
          docker compose up -d cloud
          cloud() { timeout 10m docker compose exec -T cloud cloud "$@"; }
          lab() { docker compose run --rm -T lab "$@"; }
          for _ in $(seq 1 60); do
            if cloud machine-types list; then break; fi
            sleep 2
          done
          cloud clusters create demo
          cloud clusters get-credentials demo
          [[ "$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')" == https://127.0.0.1:* ]]
          kubectl -n yakd-dashboard rollout status deployment/yakd-dashboard --timeout=5m
          kubectl get nodes -L node.kubernetes.io/instance-type,topology.kubernetes.io/zone
          # The cloud image must work without either host Kubernetes CLI binary.
          docker compose exec -T cloud sh -c '! command -v minikube && ! command -v kubectl'
          # Verify real runtime quotas as well as what Kubernetes can schedule.
          test "$(docker inspect demo --format '{{.HostConfig.NanoCpus}}')" = 2000000000
          test "$(docker inspect demo --format '{{.HostConfig.Memory}}')" = 2147483648
          test "$(kubectl get node demo -o jsonpath='{.status.allocatable.cpu}')" = 2
          lab install autoscaler
          kubectl -n kube-system rollout status deployment/cluster-autoscaler --timeout=5m
          lab load start
          wait_nodes() {
            local expected=$1 deadline=$((SECONDS + 900)) observed
            while (( SECONDS < deadline )); do
              observed=$(kubectl get nodes -o json | jq '[.items[] | select(any(.status.conditions[]; .type == "Ready" and .status == "True"))] | length')
              if [[ "$observed" == "$expected" ]]; then return 0; fi
              sleep 5
            done
            kubectl get nodes
            return 1
          }
          wait_nodes 2
          kubectl rollout status deployment/lab-load --timeout=5m
          cloud machines list
          cloud operations list
          kubectl get pods -l app=lab-load
          lab load stop
          wait_nodes 1
          # Kubernetes can remove the Node before the cloud finishes Docker teardown.
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/v1/operations | jq -e 'all(.[]; .status != "RUNNING")' > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/v1/operations | jq -e 'all(.[]; .status != "RUNNING")'
          cloud operations list
          for machine in demo-m02 demo-m03; do
            test -z "$(docker volume ls --filter "label=name.minikube.sigs.k8s.io=$machine" --format '{{.Name}}')"
          done
          cloud clusters delete demo
      - name: Diagnostics
        if: failure() || cancelled()
        run: |
          docker ps -a --no-trunc > containers.txt 2>&1 || true
          docker network inspect minikube-cloud-lab > network-inspect.json 2>&1 || true
          docker inspect demo > node-inspect.json 2>&1 || true
          docker compose logs --no-color cloud > cloud.log 2>&1 || true
          for machine in demo demo-m02 demo-m03; do
            timeout 30s docker exec "$machine" journalctl -u kubelet -n 80 --no-pager > "$machine-kubelet.log" 2>&1 || true
          done
          kubectl --request-timeout=10s get events -A --sort-by=.lastTimestamp > events.txt 2>&1 || true
          kubectl --request-timeout=10s -n kube-system logs deployment/cluster-autoscaler > autoscaler.log 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure() || cancelled()
        with:
          name: student-path-diagnostics
          path: |
            cloud.log
            events.txt
            autoscaler.log
            containers.txt
            node-inspect.json
            network-inspect.json
            *-kubelet.log
          if-no-files-found: ignore
      - name: Stop cloud container
        if: always()
        run: docker compose down || true
