name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  GO_VERSION: "1.27.x"
jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uvx pre-commit run --all-files --show-diff-on-failure
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install shell test prerequisite
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: make tidy-check vuln race cover
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: quality-reports
          path: |
            coverage.out
            vuln-report.json
          if-no-files-found: ignore
  images:
    needs: [pre-commit, go]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make images
      - name: Image and Compose smoke tests
        run: |
          docker run --rm minikube-cloud-lab/cloud:dev --help
          docker run --rm minikube-cloud-lab/lab:dev --help
          docker run --rm --entrypoint docker minikube-cloud-lab/cloud:dev --version
          go test -tags docker . -run TestComposeConfiguration -v
      - name: Scan cloud image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: minikube-cloud-lab/cloud:dev
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan lab image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: minikube-cloud-lab/lab:dev
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
  publish:
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish cloud
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: cloud
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/miciav/minikube-cloud-lab/cloud:latest
            ghcr.io/miciav/minikube-cloud-lab/cloud:sha-${{ github.sha }}
          cache-from: type=gha,scope=images
          cache-to: type=gha,scope=images,mode=max
      - name: Publish lab
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: lab
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/miciav/minikube-cloud-lab/lab:latest
            ghcr.io/miciav/minikube-cloud-lab/lab:sha-${{ github.sha }}
          cache-from: type=gha,scope=images
          cache-to: type=gha,scope=images,mode=max
