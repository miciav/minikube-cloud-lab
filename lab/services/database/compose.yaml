services:
  database:
    image: docker.io/library/postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
    restart: unless-stopped
    ports: ["127.0.0.1:${SERVICE_PORT:-15432}:5432"]
    environment:
      POSTGRES_PASSWORD_FILE: /run/bootstrap/admin
      POSTGRES_DB: course
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - data:/var/lib/postgresql/data
      - ${SERVICE_STATE:?}/admin:/run/bootstrap/admin:ro,z
      - ${SERVICE_STATE:?}/student:/run/bootstrap/student:ro,z
      - ./init.sh:/docker-entrypoint-initdb.d/init.sh:ro,z
volumes:
  data: {}
