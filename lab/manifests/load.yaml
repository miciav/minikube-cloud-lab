apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-load
  namespace: default
  labels:
    app: lab-load
spec:
  replicas: 4
  selector:
    matchLabels:
      app: lab-load
  template:
    metadata:
      labels:
        app: lab-load
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 600m
              memory: 64Mi
            limits:
              cpu: 600m
              memory: 64Mi
