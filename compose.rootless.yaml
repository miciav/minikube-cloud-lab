services:
  cloud:
    labels:
      io.course.console.project: ${COMPOSE_PROJECT_NAME}
    restart: always
    image: ${CLOUD_IMAGE:-ghcr.io/miciav/minikube-cloud-lab/cloud:latest}
    command: [serve, --data-dir, /data, --api, '0.0.0.0:8080']
    user: '0:0'
    security_opt: [label=disable]
    ports: ['127.0.0.1:8080:8080']
    environment:
      CLOUD_COURSE_PROJECT: ${CLOUD_COURSE_PROJECT:-mcl}
      CLOUD_INSTANCE_LB_URL: http://instance-lb:8082
      CLOUD_INSTANCE_METRICS_URL: http://instance-metrics:9090
      CLOUD_INSTANCE_AUTOSCALER_URL: http://127.0.0.1:8085
      CLOUD_DISK_VOLUME: minikube-cloud-lab-rootless-disks
      CLOUD_ROOTLESS: 'true'
      CLOUD_STORAGE_VOLUME: minikube-cloud-lab-rootless-storage
      CLOUD_STORAGE_CAPACITY: ${CLOUD_STORAGE_CAPACITY:-20Gi}
      CLOUD_DOCKER_NETWORK: minikube-cloud-lab-rootless
      CLOUD_DOCKER_IP: ${CLOUD_DOCKER_IP:-172.30.0.254}
      CLOUD_DEBIAN_IMAGE: ${DEBIAN_IMAGE:-ghcr.io/miciav/minikube-cloud-lab/instance-debian:12}
      CLOUD_UBUNTU_IMAGE: ${UBUNTU_IMAGE:-ghcr.io/miciav/minikube-cloud-lab/instance-ubuntu:26.04}
    networks:
      portal: {}
      lab:
        ipv4_address: ${CLOUD_DOCKER_IP:-172.30.0.254}
    volumes:
      - ${XDG_RUNTIME_DIR:?XDG_RUNTIME_DIR must identify the student runtime directory}/podman/podman.sock:/var/run/docker.sock
      - state:/data
      - autoscaling:/data/autoscaling
      - instance-disks:/data/instance-disks
      - kube:/kube
      - storage:/data/storage
  portal:
    image: ${PORTAL_IMAGE:-ghcr.io/miciav/minikube-cloud-lab/portal:latest}
    profiles: [portal]
    depends_on: [cloud]
    ports: ["127.0.0.1:3000:3000"]
    networks: [portal]
    restart: always
  lab:
    security_opt: [label=disable]
    image: ${LAB_IMAGE:-ghcr.io/miciav/minikube-cloud-lab/lab:latest}
    profiles: [tools]
    user: '0:0'
    network_mode: service:cloud
    environment:
      KUBECONFIG: /data/minikube/kubeconfig
    volumes: [state:/data:ro]
  kubectl-forward:
    security_opt: [label=disable]
    image: ${LAB_IMAGE:-ghcr.io/miciav/minikube-cloud-lab/lab:latest}
    profiles: [tools]
    user: '0:0'
    networks: [lab]
    environment:
      KUBECONFIG: /data/minikube/kubeconfig
    volumes: [state:/data:ro]
  monitoring:
    image: docker.io/prom/prometheus:v3.11.3@sha256:e4254400b85610324913f0dc4acf92603d9984e7519414c5a12811aa6146acc3
    profiles: [monitoring]
    restart: always
    network_mode: service:cloud
    depends_on: [cloud]
    labels:
      io.course.monitoring.scope: ${CLOUD_COURSE_PROJECT:-mcl}
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=1d", "--web.listen-address=127.0.0.1:9092"]
    volumes:
      - ./lab/services/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - monitoring-history:/prometheus
  instance-lb:
    security_opt: [label=disable]
    image: docker.io/library/traefik:v3.6@sha256:31267173a15b4944e797a76ffd9c419707c8d8b32fe5b610f80cd0cfa05f372d
    profiles: [instance-autoscaling]
    restart: always
    ports: ["127.0.0.1:8084:8080"]
    networks:
      lab:
        ipv4_address: ${CLOUD_INSTANCE_LB_IP:-172.30.0.255}
    volumes: [autoscaling:/autoscaling:ro]
    command:
      - --providers.file.directory=/autoscaling/traefik
      - --entrypoints.web.address=:8080
      - --entrypoints.metrics.address=:8081
      - --metrics.prometheus.entrypoint=metrics
      - --api.insecure=true
      - --entrypoints.traefik.address=:8082
  instance-metrics:
    security_opt: [label=disable]
    image: docker.io/prom/prometheus:v3.11.3@sha256:e4254400b85610324913f0dc4acf92603d9984e7519414c5a12811aa6146acc3
    profiles: [instance-autoscaling]
    restart: always
    ports: ["127.0.0.1:9091:9090"]
    networks:
      lab:
        ipv4_address: ${CLOUD_INSTANCE_METRICS_IP:-172.30.1.0}
    volumes: [./tools/instance-autoscaler/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=1d"]
  instance-autoscaler:
    security_opt: [label=disable]
    image: localhost/minikube-cloud-lab/instance-autoscaler:local
    build: ./tools/instance-autoscaler
    profiles: [instance-autoscaling]
    restart: always
    network_mode: service:cloud
    volumes: [autoscaling:/autoscaling:ro]

networks:
  portal: {}
  lab:
    name: minikube-cloud-lab-rootless
    driver: bridge
    ipam:
      config:
        - subnet: ${CLOUD_DOCKER_SUBNET:-172.30.0.0/23}
          gateway: ${CLOUD_DOCKER_GATEWAY:-172.30.0.1}
volumes:
  monitoring-history:
    labels:
      io.course.monitoring.scope: ${CLOUD_COURSE_PROJECT:-mcl}
  autoscaling:
  instance-disks:
    name: minikube-cloud-lab-rootless-disks
  state:
    name: minikube-cloud-lab-rootless-state
  kube:
    name: minikube-cloud-lab-rootless-kube
  storage:
    name: minikube-cloud-lab-rootless-storage
