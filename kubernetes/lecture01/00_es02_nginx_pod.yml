---
apiVersion: v1
kind: Pod
metadata:
  name: nginx
  namespace: default
  labels:
    app.kubernetes.io/name: nginx
spec:
  containers:
    - name: nginx
      image: nginx:stable
      ports:
        - name: http
          containerPort: 80
          protocol: TCP
      volumeMounts:
        - name: data
          mountPath: "/usr/share/nginx/html"
  volumes:
    - name: data
      configMap:
        name: nginx-data
