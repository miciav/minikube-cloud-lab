apiVersion: v1
kind: Secret
metadata:
  name: db-auth
  namespace: default
  labels:
    app.kubernetes.io/part-of: voting
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  namespace: default
  labels:
    app.kubernetes.io/part-of: voting
spec:
  storageClassName: cloud-retain
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: default
  labels:
    app.kubernetes.io/part-of: voting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
        course-lab: lecture02
    spec:
      containers:
      - name: db
        image: postgres:15-alpine
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        ports:
        - containerPort: 5432
        readinessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 2
          periodSeconds: 3
        envFrom:
        - secretRef:
            name: db-auth
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: db-data
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: default
  labels:
    app.kubernetes.io/part-of: voting
spec:
  type: ClusterIP
  selector:
    app: db
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: default
  labels:
    app.kubernetes.io/part-of: voting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        course-lab: lecture02
    spec:
      containers:
      - name: redis
        image: redis:7.4-alpine
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            memory: 128Mi
        ports:
        - containerPort: 6379
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 2
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: default
  labels:
    app.kubernetes.io/part-of: voting
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  namespace: default
  labels:
    app.kubernetes.io/part-of: voting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
        course-lab: lecture02
    spec:
      containers:
      - name: vote
        image: dockersamples/examplevotingapp_vote:latest
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            memory: 128Mi
        ports:
        - containerPort: 80
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 3
        imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: vote
  namespace: default
  labels:
    app.kubernetes.io/part-of: voting
spec:
  type: ClusterIP
  selector:
    app: vote
  ports:
  - port: 80
    targetPort: 80
---
