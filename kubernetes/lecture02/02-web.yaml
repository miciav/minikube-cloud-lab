apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lecture02
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        course-lab: lecture02
    spec:
      containers:
      - name: web
        image: nginx:1.28.0
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            memory: 128Mi
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: lecture02
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
  - port: 80
    targetPort: 80
