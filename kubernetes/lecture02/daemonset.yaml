apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: default
spec:
  selector:
    matchLabels:
      app: node-agent
  template:
    metadata:
      labels:
        app: node-agent
        course-lab: lecture02
    spec:
      containers:
      - name: node-agent
        image: busybox:1.37.0
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            memory: 128Mi
        command:
        - sh
        - -c
        - while true; do echo "agent on $NODE_NAME"; sleep 30; done
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
