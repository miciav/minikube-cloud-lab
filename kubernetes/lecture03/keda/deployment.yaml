# Adapted from https://keda.sh/docs/2.21/deploy/#step-1-deploy-a-sample-application
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keda-http
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keda-http
  template:
    metadata:
      labels:
        app: keda-http
    spec:
      containers:
        - name: http-echo
          image: hashicorp/http-echo:1.0.0
          args: ["-text=Hello, KEDA!"]
          ports:
            - containerPort: 5678
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 5678
            initialDelaySeconds: 1
            periodSeconds: 2
